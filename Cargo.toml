[package]
name = "soccer-cache"
version = "0.1.0"
edition = "2024"
description = "Model caching for the SOCcer ecosystem"
license = "MIT"
repository = "https://github.com/danielruss/soccer-cache"
readme = "README.md"

[dependencies]
dirs = "6.0.0"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3.27.0"
thiserror = "2"
